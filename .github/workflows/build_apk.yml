name: Build Soko Rider APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'customer_app/**'
      - 'shop_app/**'
      - '.github/workflows/build_customer.yml'
      - '.github/workflows/build_shop.yml'
      - 'brv_pos/**'
      - '.github/workflows/build_brv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        run: |
          flutter create --platforms=android --org=ke.co.sokoexpressmtaani --project-name=rider_app .
          python3 -c "
          import os
          p = \"android/app/src/main/AndroidManifest.xml\"
          c = open(p).read()
          perms = [
              \"ACCESS_FINE_LOCATION\", \"ACCESS_COARSE_LOCATION\", \"INTERNET\",
              \"FOREGROUND_SERVICE\", \"FOREGROUND_SERVICE_LOCATION\",
              \"POST_NOTIFICATIONS\", \"WAKE_LOCK\", \"VIBRATE\",
              \"USE_FULL_SCREEN_INTENT\",
          ]
          tags = \"\".join(\"    <uses-permission android:name=\\\"android.permission.%s\\\" />\\n\" % x for x in perms if (\"permission.\" + x + chr(34)) not in c)
          intents = (
              \"        <intent><action android:name=\\\"android.intent.action.VIEW\\\" /><data android:scheme=\\\"https\\\" /></intent>\\n\"
              \"        <intent><action android:name=\\\"android.intent.action.VIEW\\\" /><data android:scheme=\\\"geo\\\" /></intent>\\n\"
              \"        <intent><action android:name=\\\"android.intent.action.DIAL\\\" /><data android:scheme=\\\"tel\\\" /></intent>\\n\"
          )
          c = c.replace(\"<application\", tags + \"    <application\", 1)
          if \"<queries>\" in c:
              c = c.replace(\"<queries>\", \"<queries>\\n\" + intents, 1)
          else:
              c = c.replace(\"</manifest>\", \"    <queries>\\n\" + intents + \"    </queries>\\n</manifest>\", 1)
          c = c.replace(\"android:label=\\\"rider_app\\\"\", \"android:label=\\\"Soko Rider\\\"\")
          open(p, \"w\").write(c)
          print(c)
          "

      - name: Soko launcher icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in assets/icon/mipmap-*; do
            cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename "$d")/ic_launcher.png"
          done

      - name: Soko request sound and notification channel
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/sound/soko_request.wav android/app/src/main/res/raw/soko_request.wav
          cp android_overrides/keep.xml android/app/src/main/res/raw/keep.xml
          MAIN=$(find android/app/src/main -name MainActivity.kt | head -1)
          echo "Replacing $MAIN"
          cp android_overrides/MainActivity.kt "$MAIN"
          python3 -c "
          p = \"android/app/src/main/AndroidManifest.xml\"
          c = open(p).read()
          meta = \"        <meta-data android:name=\\\"com.google.firebase.messaging.default_notification_channel_id\\\" android:value=\\\"soko_requests\\\" />\\n\"
          if \"default_notification_channel_id\" not in c:
              c = c.replace(\"</application>\", meta + \"    </application>\", 1)
          open(p, \"w\").write(c)
          "

      - name: Use fixed signing key (so the app updates without uninstalling)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            for dir in "$HOME/.android" "${ANDROID_USER_HOME:-}"; do
              [ -z "$dir" ] && continue
              mkdir -p "$dir"
              echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$dir/debug.keystore"
            done
            echo "Signing with the fixed Soko Rider key"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set. The APK is signed with a random key, so phones must uninstall the old app before installing this one."
          fi

      - name: Play Store signing setup
        run: python3 android_overrides/play_signing.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Release APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "::warning::Firebase secrets not set. Request alerts will only work while the app is open/online."
          fi
          flutter build apk --release \
            --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"

      - name: Compile Play Store App Bundle (.aab)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::warning::UPLOAD_KEYSTORE_BASE64 / UPLOAD_KEYSTORE_PASSWORD secrets not set. Skipping the Play Store App Bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          export UPLOAD_KEY_ALIAS=upload
          export UPLOAD_KEY_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD"
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          rm -f "$UPLOAD_KEYSTORE_PATH"

      - name: Upload Play Store App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Soko-Rider-PlayStore-Bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Upload APK Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soko-Rider-App
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Soko Express Rider v1.0.${{ github.run_number }} (Release)"
          body: "Official Soko Express Mtaani Rider Android App (Live GPS Tracking & Odoo Integration)."
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
