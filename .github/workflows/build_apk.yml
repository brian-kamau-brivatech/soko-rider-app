name: Build Soko Rider APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        run: |
          flutter create --platforms=android --org=ke.co.sokoexpressmtaani --project-name=rider_app .
          python3 -c "
          import os
          p = \"android/app/src/main/AndroidManifest.xml\"
          c = open(p).read()
          perms = [
              \"ACCESS_FINE_LOCATION\", \"ACCESS_COARSE_LOCATION\", \"INTERNET\",
              \"FOREGROUND_SERVICE\", \"FOREGROUND_SERVICE_LOCATION\",
              \"POST_NOTIFICATIONS\", \"WAKE_LOCK\",
          ]
          tags = \"\".join(\"    <uses-permission android:name=\\\"android.permission.%s\\\" />\\n\" % x for x in perms if (\"permission.\" + x + chr(34)) not in c)
          intents = (
              \"        <intent><action android:name=\\\"android.intent.action.VIEW\\\" /><data android:scheme=\\\"https\\\" /></intent>\\n\"
              \"        <intent><action android:name=\\\"android.intent.action.VIEW\\\" /><data android:scheme=\\\"geo\\\" /></intent>\\n\"
              \"        <intent><action android:name=\\\"android.intent.action.DIAL\\\" /><data android:scheme=\\\"tel\\\" /></intent>\\n\"
          )
          c = c.replace(\"<application\", tags + \"    <application\", 1)
          if \"<queries>\" in c:
              c = c.replace(\"<queries>\", \"<queries>\\n\" + intents, 1)
          else:
              c = c.replace(\"</manifest>\", \"    <queries>\\n\" + intents + \"    </queries>\\n</manifest>\", 1)
          c = c.replace(\"android:label=\\\"rider_app\\\"\", \"android:label=\\\"Soko Rider\\\"\")
          open(p, \"w\").write(c)
          print(c)
          "

      - name: Soko launcher icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in assets/icon/mipmap-*; do
            cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename "$d")/ic_launcher.png"
          done

      - name: Use fixed signing key (so the app updates without uninstalling)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            for dir in "$HOME/.android" "${ANDROID_USER_HOME:-}"; do
              [ -z "$dir" ] && continue
              mkdir -p "$dir"
              echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$dir/debug.keystore"
            done
            echo "Signing with the fixed Soko Rider key"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set. The APK is signed with a random key, so phones must uninstall the old app before installing this one."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload APK Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soko-Rider-App
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Soko Express Rider v1.0.${{ github.run_number }} (Release)"
          body: "Official Soko Express Mtaani Rider Android App (Live GPS Tracking & Odoo Integration)."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
