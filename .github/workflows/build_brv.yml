name: Build BRV POS

on:
  push:
    branches: [ main ]
    paths:
      - 'brv_pos/**'
      - '.github/workflows/build_brv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BRV POS APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brv_pos
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org=ke.co.brivatech --project-name=brv_pos .
          rm -rf test
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          mark = Image.open("assets/app_mark.png").convert("RGBA")
          for d, s in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              im = mark.resize((s, s), Image.LANCZOS)
              im.save("android/app/src/main/res/mipmap-%s/ic_launcher.png" % d)
          print("launcher icons made")
          PY
          python3 android_overrides/patch_native.py

      - name: Fixed debug key for the GitHub APK
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install Android NDK (with retries)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            if yes | "$SDKM" --install "ndk;27.0.12077973" > /tmp/ndk.log 2>&1 \
               && [ -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties" ]; then
              echo "NDK installed"; exit 0
            fi
            echo "NDK download failed (try $i), retrying"; tail -5 /tmp/ndk.log; sleep 15
          done
          exit 1

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: BRV-POS
          path: brv_pos/build/app/outputs/flutter-apk/app-release.apk

      - name: Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: brv-v1.0.${{ github.run_number }}
          name: "BRV POS v1.0.${{ github.run_number }}"
          body: "BRV POS: KRA eTIMS point of sale that signs sales through your VSCU. Install the APK on the till."
          files: |
            brv_pos/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
