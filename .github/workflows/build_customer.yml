name: Build Soko Customer App

on:
  push:
    branches: [ main ]
    paths:
      - 'customer_app/**'
      - '.github/workflows/build_customer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build customer APK + Play Store bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org=ke.co.sokoexpressmtaani --project-name=soko_shop .
          rm -rf test
          mkdir -p assets
          cp ../assets/logo.png assets/logo.png
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          mark = Image.open("../assets/logo_mark.png").convert("RGBA")
          for d, s in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              im = Image.new("RGBA", (s, s), (255, 255, 255, 255))
              m = mark.resize((int(s * 0.86),) * 2, Image.LANCZOS)
              im.paste(m, ((s - m.width) // 2, (s - m.height) // 2), m)
              im.convert("RGB").save("android/app/src/main/res/mipmap-%s/ic_launcher.png" % d)
          print("launcher icons made")
          PY
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          c = open(p).read()
          perms = ["INTERNET", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"]
          tags = "".join('    <uses-permission android:name="android.permission.%s" />\n' % x
                         for x in perms if ('permission.%s"' % x) not in c)
          c = c.replace("<application", tags + "    <application", 1)
          intents = ('        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n'
                     '        <intent><action android:name="android.intent.action.DIAL" /><data android:scheme="tel" /></intent>\n')
          if "<queries>" in c:
              c = c.replace("<queries>", "<queries>\n" + intents, 1)
          else:
              c = c.replace("</manifest>", "    <queries>\n" + intents + "    </queries>\n</manifest>", 1)
          c = c.replace('android:label="soko_shop"', 'android:label="Soko Express"')
          open(p, "w").write(c)
          print(c)
          PY

      - name: Play Store signing setup
        run: python3 ../android_overrides/play_signing.py

      - name: Fixed debug key for the GitHub APK
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Build Play Store App Bundle (.aab)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Upload key secrets not set. Skipping the Play Store bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          export UPLOAD_KEY_ALIAS=upload
          export UPLOAD_KEY_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD"
          flutter build appbundle --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          rm -f "$UPLOAD_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: Soko-Customer-PlayStore-Bundle
          path: customer_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Soko-Customer-App
          path: customer_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shop-v1.0.${{ github.run_number }}
          name: "Soko Express customer app v1.0.${{ github.run_number }}"
          body: "Soko Express Mtaani customer app: shop, pay with M-Pesa, track your delivery."
          files: |
            customer_app/build/app/outputs/flutter-apk/app-release.apk
            customer_app/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
