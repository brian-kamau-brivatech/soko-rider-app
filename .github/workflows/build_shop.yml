name: Build Soko Shop App (staff)

on:
  push:
    branches: [ main ]
    paths:
      - 'shop_app/**'
      - '.github/workflows/build_shop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build shop counter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org=ke.co.sokoexpressmtaani --project-name=soko_staff .
          rm -rf test
          mkdir -p assets
          cp ../assets/logo.png assets/logo.png
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          mark = Image.open("../assets/logo_mark.png").convert("RGBA")
          for d, s in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              im = Image.new("RGBA", (s, s), (255, 255, 255, 255))
              m = mark.resize((int(s * 0.86),) * 2, Image.LANCZOS)
              im.paste(m, ((s - m.width) // 2, (s - m.height) // 2), m)
              im.convert("RGB").save("android/app/src/main/res/mipmap-%s/ic_launcher.png" % d)
          print("launcher icons made")
          PY
          python3 android_overrides/patch_native.py

      - name: Play Store signing setup
        run: python3 ../android_overrides/play_signing.py

      - name: Fixed debug key for the GitHub APK
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Soko-Shop-Staff-App
          path: shop_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staff-v1.0.${{ github.run_number }}
          name: "Soko Shop (counter device) v1.0.${{ github.run_number }}"
          body: "Soko Shop app for the shop counter device: incoming orders, ringing alerts, riders. Install the APK on the shop device."
          files: |
            shop_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
