name: Build Utange apps (POS handheld + Manager)

on:
  push:
    branches: [ main ]
    paths:
      - 'utange_app/**'
      - '.github/workflows/build_utange.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: pos
            project: utange_pos
            label: Utange POS
            color: '#0F766E'
            tag: utange-pos
            apk: Utange-POS
          - mode: manager
            project: utange_manager
            label: Utange Manager
            color: '#12304A'
            tag: utange-manager
            apk: Utange-Manager
    defaults:
      run:
        working-directory: utange_app
    env:
      UTANGE_URL: ${{ vars.UTANGE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Generate Android project
        env:
          APP_LABEL: ${{ matrix.label }}
        run: |
          sed -i 's/^name: utange_pos/name: ${{ matrix.project }}/' pubspec.yaml
          flutter create --platforms=android --org=ke.co.brivatech --project-name=${{ matrix.project }} .
          rm -rf test
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          logo = Image.open('../brv_pdf_etr/assets/icon.png').convert('RGBA')
          big = 512
          im = Image.new('RGBA', (big, big), (255, 255, 255, 255))
          inner = int(big * 0.86)
          lg = logo.resize((inner, inner), Image.LANCZOS)
          im.alpha_composite(lg, ((big - inner) // 2, (big - inner) // 2))
          im = im.convert('RGB')
          for dpi, s in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              im.resize((s, s), Image.LANCZOS).save("android/app/src/main/res/mipmap-%s/ic_launcher.png" % dpi)
          print("BRV launcher icons made")
          PY
          python3 android_overrides/patch_native.py

      - name: Fixed debug key for the GitHub APK
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install Android NDK (with retries)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            if yes | "$SDKM" --install "ndk;27.0.12077973" > /tmp/ndk.log 2>&1 \
               && [ -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties" ]; then
              echo "NDK installed"; exit 0
            fi
            echo "NDK download failed (try $i), retrying"; tail -5 /tmp/ndk.log; sleep 15
          done
          exit 1

      - name: Build APKs (light 64-bit + 32-bit for older handhelds)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm \
            --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} \
            --dart-define=APP_MODE=${{ matrix.mode }} --dart-define=ODOO_DB=utangevillage
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ${{ matrix.apk }}-64bit.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ${{ matrix.apk }}-32bit.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: utange_app/${{ matrix.apk }}-*.apk

      - name: Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}-v1.0.${{ github.run_number }}
          name: "${{ matrix.label }} v1.0.${{ github.run_number }}"
          body: "${{ matrix.label }} for Utange Village Hotel (Odoo POS). Utange POS: handheld at the bar (cashier PIN login, selling, stock sheet at shift open/close, requisitions). Utange Manager: managers' phones (approve requisitions, shifts and stock sheets). Download the -64bit.apk (light, for most phones and handhelds); use -32bit.apk only if the 64-bit one says the app is not compatible."
          files: |
            utange_app/${{ matrix.apk }}-64bit.apk
            utange_app/${{ matrix.apk }}-32bit.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
