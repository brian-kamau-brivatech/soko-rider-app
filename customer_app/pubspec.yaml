name: soko_shop
description: "Soko Express Mtaani customer app: shop, pay with M-Pesa, track delivery."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  geolocator: ^13.0.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
